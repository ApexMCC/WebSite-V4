<!DOCTYPE html>
<html>
<head>
    <title>Page Redirect</title>
    <script type="text/javascript">
        // Only redirect if the current URL does not already contain '/public'
        if (!window.location.pathname.includes('/public')) {
            window.location.href = "/public";
        }
    </script>
</head>
<body>
    <p>If you are not redirected, <a href="/public">click here</a>.</p>
</body>
</html>
