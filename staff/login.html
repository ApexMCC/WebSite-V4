<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex One — Staff Sign In</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#000;--card:#0d0d0d;--border:#29312b;--text:#eaf1eb;--muted:#8b988e;--accent:#3bc94e}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.top-logo{position:fixed;top:20px;left:24px}
.top-logo img{width:160px}
.card{width:min(460px,100%);margin:auto;padding:32px 0}
.auth{border:1px solid var(--border);border-radius:12px;padding:38px;background:var(--card)}
.auth-header{text-align:center;margin-bottom:30px}
.auth-header p{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.auth-header h1{font-size:27px;font-weight:600;margin-bottom:9px}
.auth-header span{font-size:13px;line-height:1.5;color:var(--muted)}
.auth-btn{width:100%;height:50px;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--border);border-radius:8px;background:#111;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.auth-btn:hover{background:#181818;border-color:#fff}
.auth-btn:active{transform:scale(.99)}
.auth-btn:disabled{opacity:.55;cursor:default}
.provider-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.provider-icon svg{width:20px;height:20px}
.message{min-height:18px;margin-top:16px;font-size:13px;text-align:center}
.notice{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);font-size:11px;line-height:1.6;text-align:center;color:var(--muted)}
.footer{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:18px;padding:14px 24px;border-top:1px solid var(--border);background:#000}
.footer-logo img{width:44px;height:44px}
.footer p{max-width:600px;font-size:10px;line-height:1.6;color:#737b75}
.footer a{color:#ddd;text-decoration:none}
.footer a:hover{text-decoration:underline}
@media(max-width:600px){body{padding:18px}.top-logo{position:static;align-self:flex-start;margin-bottom:20px}.top-logo img{width:140px}.card{padding:20px 0}.auth{padding:30px 22px}.footer{position:static;margin-top:20px;align-items:flex-start}}
</style>
</head>
<body>

<header class="top-logo">
<img src="assets/images/apex-long.webp" alt="Apex">
</header>

<main class="card">
<section class="auth">

<div class="auth-header">
<p>Apex One</p>
<h1>Staff Sign In</h1>
<span>Sign in to access the Apex One staff portal.</span>
</div>

<!-- GOOGLE AUTH
     Comment this section out to disable Google. -->
<section>
<button class="auth-btn" type="button" onclick="signIn('google')">
<span class="provider-icon">
<svg viewBox="0 0 48 48">
<path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/>
<path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/>
<path fill="#FBBC05" d="M11.69 28.18c-.42-1.26-.66-2.6-.66-4.18s.24-2.92.66-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"/>
<path fill="#EA4335" d="M24 9.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 3.18 29.93 1 24 1 15.4 1 7.96 4.93 4.34 11.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/>
</svg>
</span>
Continue with Google
</button>
</section>

m.textContent="";
